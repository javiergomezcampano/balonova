<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balonova — Mi Equipo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="shell">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12 C6 14 18 14 22 12"/>
          </svg>
        </div>
        <div>
          <div class="logo-name">Balonova</div>
          <div class="logo-sub">Mi Equipo</div>
        </div>
      </div>
    </div>

    <!-- Los enlaces del menú cambian la vista sin recargar (data-vista) -->
    <nav>
      <button class="nav-item active" data-vista="inicio">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></span>
        Inicio
      </button>
      <button class="nav-item" data-vista="jugadores">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></span>
        Jugadores
      </button>
      <button class="nav-item" data-vista="partidos">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg></span>
        Partidos
      </button>
      <button class="nav-item" data-vista="stats">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M5 9.2h3V19H5V9.2zM10.6 5h2.8v14h-2.8V5zm5.6 8H19v6h-2.8v-6z"/></svg></span>
        Estadísticas
      </button>
      <!-- Solo visible para administradores (lo muestra app.js) -->
      <button class="nav-item" data-vista="usuarios" id="nav-usuarios" style="display:none">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></span>
        Usuarios
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="avatar" id="user-avatar">U</div>
      <div>
        <div class="user-name" id="user-name">Usuario</div>
        <div class="user-role" id="user-role"></div>
      </div>
      <button class="logout-btn" id="btn-logout" title="Cerrar sesión" style="background:none;border:none;cursor:pointer">
        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- ── CONTENIDO PRINCIPAL ── -->
  <main class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="topbar-title">Bienvenido</div>
        <div class="topbar-sub">Temporada 2025/2026</div>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="content">
      <!-- Zona de avisos (éxito/error) -->
      <div id="avisos"></div>
      <!-- Aquí el JS inyecta la vista activa -->
      <div id="vista"></div>
    </div>
  </main>
</div>

<!-- Núcleo -->
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<!-- Vistas (cada módulo en su archivo) -->
<script src="js/inicio.js"></script>
<script src="js/jugadores.js"></script>
<script src="js/partidos.js"></script>
<script src="js/stats.js"></script>
<script src="js/usuarios.js"></script>
<!-- Arranque y enrutado entre vistas -->
<script src="js/app.js"></script>
</body>
</html>
