<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso — Balonova</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="login-body">

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon" style="width:48px;height:48px;margin:0 auto 16px;border-radius:12px">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="28" height="28">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12 C6 14 18 14 22 12"/>
          </svg>
        </div>
        <div class="login-title">Balonova</div>
        <div class="login-sub">Accede a tu panel de equipo</div>
      </div>

      <!-- Zona donde el JS mostrará los errores -->
      <div id="login-error"></div>

      <!-- El formulario NO recarga la página: lo gestiona login.js con fetch -->
      <form id="login-form">
        <div class="form-group" style="margin-bottom:16px">
          <label class="form-label">Email</label>
          <input class="form-input" type="email" id="email" placeholder="admin@balonova.com" required>
        </div>
        <div class="form-group" style="margin-bottom:20px">
          <label class="form-label">Contraseña</label>
          <input class="form-input" type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px">
          Entrar
        </button>
      </form>

      <div style="text-align:center;margin-top:20px;font-size:12px;color:var(--muted)">
        Demo: admin@balonova.com / admin1234
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
