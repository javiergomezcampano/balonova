version: '3.8'

services:

  # ── Servidor web: Apache + PHP 8.2 ───────────────────────────────────────
  web:
    build: .
    container_name: balonova_web
    ports:
      - "8080:80"             # App disponible en http://localhost:8080
    volumes:
      - ./src:/var/www/html   # Carpeta src/ montada como raíz del servidor
    depends_on:
      - db
    networks:
      - balonova_net
    restart: unless-stopped

  # ── Base de datos: MySQL 8.0 ──────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: balonova_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE:      balonova
      MYSQL_USER:          balonova_user
      MYSQL_PASSWORD:      balonova_pass
      MYSQL_ROOT_PASSWORD: root_secret
    volumes:
      - db_data:/var/lib/mysql                               # Datos persistentes
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql  # Se ejecuta al crear la BD
    networks:
      - balonova_net
    restart: unless-stopped

  # ── Panel de administración de la BD ─────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: balonova_pma
    ports:
      - "8081:80"             # Panel disponible en http://localhost:8081
    environment:
      PMA_HOST:     db
      PMA_USER:     balonova_user
      PMA_PASSWORD: balonova_pass
    depends_on:
      - db
    networks:
      - balonova_net
    restart: unless-stopped

# ── Volúmenes y redes ─────────────────────────────────────────────────────
volumes:
  db_data:

networks:
  balonova_net:
    driver: bridge
